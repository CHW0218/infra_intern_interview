[project]
name = "vm-manager"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "grpcio>=1.60", "protobuf>=4.25"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vm = "vm.cli:main"

[tool.pytest.ini_options]
markers = ["integration: requires live mock servers"]
addopts = "-ra"
